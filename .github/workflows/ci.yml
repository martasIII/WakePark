# Build a testy při každém pushi do main a u každého pull requestu.
# Na main navíc: obrazy webu a API do GitHub Container Registry a nasazení na VPS —
# ale jen když prošlo všechno ostatní.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nový push do stejné větve zruší rozběhnutý běh — výsledek starého commitu nikoho nezajímá.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend — build a testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Build s TreatWarningsAsErrors; ContinuousIntegrationBuild zapne Directory.Build.props podle CI=true.
      - name: Build
        run: dotnet build WakePark.sln --configuration Release

      # Integrační testy si přes Testcontainers zvednou PostgreSQL — Docker na runneru je.
      # Skript místo `dotnet test` kvůli chybě SDK 10.0.400 s xunit.v3 (viz scripts/test.ps1).
      - name: Testy (unit, architektura, web, integrační)
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend/wakepark-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/wakepark-web/package-lock.json

      - run: npm ci
      - run: npm run build

  images:
    name: Docker obraz — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: storefront
            dockerfile: src/frontend/WakePark.Storefront/Dockerfile
          - name: api
            dockerfile: src/backend/WakePark.Api/Dockerfile
          - name: backoffice
            dockerfile: src/frontend/wakepark-web/Dockerfile
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Název obrazu v registru musí být malými písmeny, vlastník repa je martasIII.
      - name: Název obrazu
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wakepark-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # U pull requestu jen ověří, že se obraz postaví. Na main ho uloží s hashem commitu;
      # značku latest dostane až po zelených testech (úloha deploy).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Každý obraz vlastní cache, jinak by si je obě úlohy navzájem přepisovaly.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Nasazení na VPS (web, backoffice, API, databáze)
    needs: [backend, frontend, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Prostředí „production“ dává v GitHubu přehled nasazení a místo pro případné schvalování.
    environment:
      name: production
      url: https://novy.wake-dzban.cz
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Obrazy, které prošly testy, dostanou značku latest — bez nového buildu.
      - name: Značka latest
        run: |
          for name in storefront api backoffice; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wakepark-$name"
            docker buildx imagetools create --tag "$image:latest" "$image:$GITHUB_SHA"
          done

      # Klíč na serveru smí spustit jen deploy.sh; argumentem je commit, který se nasadí.
      # Otisk serveru je v secretu, takže se SSH nepřipojí k podvrženému stroji.
      - name: Nasazení
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy@31.31.73.220 "$GITHUB_SHA"
