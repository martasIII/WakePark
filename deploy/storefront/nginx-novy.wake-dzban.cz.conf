# /etc/nginx/sites-available/storefront  (+ odkaz v sites-enabled)
#
# Zkušební adresa nového webu. HTTPS doplní certbot (`certbot --nginx -d novy.wake-dzban.cz`),
# stejně jako u Docházky. Po přepnutí hlavní domény se sem přidá wake-dzban.cz a www.

server {
    listen 80;
    listen [::]:80;
    server_name novy.wake-dzban.cz;

    # Web nemá formuláře s nahráváním souborů.
    client_max_body_size 1M;

    location / {
        proxy_pass         http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
