# Veřejný web na VPS. Leží v /opt/wakepark/storefront/, spouští se:
#   docker compose up -d
#
# Kontejner poslouchá jen na loopbacku hostitele — zvenku je dostupný výhradně
# přes nginx, který drží certifikát a porty 80/443 (sdílí je s Docházkou).

services:
  storefront:
    image: wakepark-storefront:latest
    container_name: wakepark-storefront
    restart: unless-stopped
    ports:
      - "127.0.0.1:5081:8080"
    environment:
      # Požadavky přicházejí od nginxu přes bridge síť Dockeru; jen odtud se věří
      # hlavičkám X-Forwarded-*, jinak by si klient mohl podvrhnout IP i https.
      Storefront__TrustedProxyNetworks__0: "172.16.0.0/12"
    # 2 GB RAM sdílí web s Docházkou. Strop drží .NET v mezích (GC se mu přizpůsobí)
    # a chybou v aplikaci se nepoloží celý server.
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
