# /etc/nginx/sites-available/backoffice  (+ odkaz v sites-enabled)
#
# Backoffice (ADR 0010, 0011). HTTPS doplní certbot (`certbot --nginx -d admin.wake-dzban.cz`).
# Za ním je kontejner wakepark-backoffice: nginx se statickým Angularem, /api posílá na API.

server {
    listen 80;
    listen [::]:80;
    server_name admin.wake-dzban.cz;

    # Import CSV sezóny je pár kB.
    client_max_body_size 2M;

    location / {
        proxy_pass         http://127.0.0.1:5082;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # API podle X-Forwarded-For počítá pokusy o přihlášení. $remote_addr místo
        # $proxy_add_x_forwarded_for: hlavičku od klienta nepřebíráme, jinak by si ji podvrhl.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
