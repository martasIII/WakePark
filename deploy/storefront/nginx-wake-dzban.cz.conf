# /etc/nginx/sites-available/wake-dzban  (+ odkaz v sites-enabled) — až při ostrém spuštění.
#
# Hlavní doména webu. Předpoklad: A záznamy wake-dzban.cz a www.wake-dzban.cz už míří na VPS
# (31.31.73.220). HTTPS doplní certbot:
#   certbot --nginx -d wake-dzban.cz -d www.wake-dzban.cz
# Postup celého přepnutí: README.md, „Ostré spuštění“.

server {
    listen 80;
    listen [::]:80;
    server_name wake-dzban.cz;

    # Web nemá formuláře s nahráváním souborů.
    client_max_body_size 1M;

    location / {
        proxy_pass         http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}

# www → bez www, se zachováním cesty (staré odkazy i vyhledávače skončí na jedné adrese).
server {
    listen 80;
    listen [::]:80;
    server_name www.wake-dzban.cz;
    return 301 https://wake-dzban.cz$request_uri;
}
