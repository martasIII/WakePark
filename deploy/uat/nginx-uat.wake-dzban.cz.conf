# /etc/nginx/sites-available/wakepark-uat  (+ odkaz v sites-enabled)
#
# Testovací prostředí UAT: web na uat.wake-dzban.cz a backoffice na admin.uat.wake-dzban.cz.
# HTTPS doplní certbot:
#   certbot --nginx -d uat.wake-dzban.cz -d admin.uat.wake-dzban.cz
#
# Web je vidět jen přihlášenému Adminovi: před každým požadavkem se nginx zeptá API UAT
# (přes backoffice-uat), jestli cookie z backoffice patří někomu s oprávněním uat.access.
# Nepřihlášeného pošle na přihlášení do backoffice UAT.

server {
    listen 80;
    listen [::]:80;
    server_name uat.wake-dzban.cz;

    client_max_body_size 1M;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Kontrola přístupu: 204 dál, 401 → přihlášení, 403 → „nemáte přístup“.
    location = /_uat_access {
        internal;
        proxy_pass              http://127.0.0.1:5084/api/v1/identity/uat-access;
        # Endpoint je GET; bez tohohle by se u odeslání formuláře zeptal POSTem.
        proxy_method            GET;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host admin.uat.wake-dzban.cz;
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto https;
    }

    location @login {
        return 302 https://admin.uat.wake-dzban.cz/prihlaseni;
    }

    location / {
        auth_request /_uat_access;
        error_page 401 = @login;

        proxy_pass         http://127.0.0.1:5083;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.uat.wake-dzban.cz;

    client_max_body_size 2M;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass         http://127.0.0.1:5084;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
