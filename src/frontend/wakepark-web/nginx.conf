# nginx uvnitř obrazu wakepark-backoffice (ADR 0010): statický Angular + /api na API
# v síti Dockeru. Před ním stojí nginx hostitele s certifikátem pro admin.wake-dzban.cz.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Import CSV sezóny je pár kB; víc backoffice zatím neposílá.
    client_max_body_size 2M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Hlavičky od nginxu hostitele jen předáme dál. Jeho X-Forwarded-For už končí
        # skutečnou IP klienta; kdybychom přidali další adresu, API by vidělo tenhle nginx.
        proxy_set_header   X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Soubory s hashem v názvu se nikdy nemění — prohlížeč je může držet napořád.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Všechno ostatní je cesta v aplikaci (/kalendar, /blokace…) → index.html. Ten se
    # necachuje, aby po nasazení prohlížeč hned sáhl po nových souborech.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
